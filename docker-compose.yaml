services:
  db:
    image: postgres:16-alpine
    container_name: 69-s2-db
    ports:
      - 127.0.0.1:${POSTGRES_PORT}:5432
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - data-postgres:/var/lib/postgresql/data

  admin:
    image: dpage/pgadmin4
    container_name: 69-s2-admin
    ports:
      - 127.0.0.1:${PGADMIN_DEFAULT_PORT}:80
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD}
    volumes:
      - data-pgadmin:/var/lib/pgadmin

  app:
    image: prawee/strapi
    container_name: 69-s2-app
    ports:
      - 127.0.0.1:${APP_PORT}:1337
    volumes:
      - ./config/plugins.js:/opt/app/config/plugins.js
      - ./config/admin.js:/opt/app/config/admin.js
      - ./config/middlewares.js:/opt/app/config/middlewares.js
      - ./src/middlewares/rate-limit.js:/opt/app/src/middlewares/rate-limit.js
      - ./src/middlewares/audit-log.js:/opt/app/src/middlewares/audit-log.js
      - ./src/middlewares/anti-enumeration.js:/opt/app/src/middlewares/anti-enumeration.js
      - ./src/middlewares/password-policy.js:/opt/app/src/middlewares/password-policy.js
      - ./src/providers/provider-email-logsend/index.js:/opt/node_modules/@strapi/provider-email-logsend/index.js
      - ./logs:/opt/app/logs
    environment:
      DATABASE_CLIENT: postgres
      DATABASE_HOST: db
      DATABASE_PORT: 5432
      DATABASE_NAME: postgres
      DATABASE_USERNAME: postgres
      DATABASE_PASSWORD: ${POSTGRES_PASSWORD}
      APP_KEYS: ${APP_KEYS}
      JWT_SECRET: ${JWT_SECRET}
      ADMIN_JWT_SECRET: ${ADMIN_JWT_SECRET}
      API_TOKEN_SALT: ${API_TOKEN_SALT}
      TRANSFER_TOKEN_SALT: ${TRANSFER_TOKEN_SALT}
    depends_on:
      - db

volumes:
  data-postgres:
  data-pgadmin: