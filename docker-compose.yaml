services:
  db:
    image: postgres:16-alpine
    container_name: 69-s2-db
    ports:
      - ${POSTGRES_PORT}:5432
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - data-postgres:/var/lib/postgresql/data

  admin:
    image: dpage/pgadmin4
    container_name: 69-s2-admin
    ports:
      - ${PGADMIN_DEFAULT_PORT}:80
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD}
    volumes:
      - data-pgadmin:/var/lib/pgadmin

  app:
    image: prawee/strapi
    container_name: 69-s2-app
    ports:
      - ${APP_PORT}:1337
    volumes:
      - ./config/plugins.js:/opt/app/config/plugins.js
      - ./config/email-provider.js:/opt/app/config/email-provider.js
    environment:
      DATABASE_CLIENT: postgres
      DATABASE_HOST: db
      DATABASE_PORT: 5432
      DATABASE_NAME: postgres
      DATABASE_USERNAME: postgres
      DATABASE_PASSWORD: ${POSTGRES_PASSWORD}
      ADMIN_JWT_SECRET: secret_key_version_2_new
      JWT_SECRET: secret_key_version_2_new
    depends_on:
      - db

volumes:
  data-postgres:
  data-pgadmin: